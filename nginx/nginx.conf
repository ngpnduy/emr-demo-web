# Run with the nginx/ directory as the prefix (see README.md).
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log;

events {
    worker_connections 1024;
}

http {
    access_log logs/access.log;
    client_body_temp_path logs/client_temp;
    proxy_temp_path logs/proxy_temp;

    server {
        listen 127.0.0.1:8080;
        server_name localhost;

        location /api/ {
            # No trailing slash: preserve /api/... for Express routes.
            proxy_pass http://127.0.0.1:5001;
            proxy_set_header Host $host;
        }

        location / {
            proxy_pass http://127.0.0.1:4173;
            # Vite receives a local Host even when the tunnel URL changes.
            proxy_set_header Host localhost;
        }
    }
}
